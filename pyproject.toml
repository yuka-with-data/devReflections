[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devReflections"
version = "0.1.0"
description = "A local-first reflection journal for open-source contributors, powered by Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pylint",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
