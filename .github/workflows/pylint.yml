name: Pylint

on:
  push:
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      # Check out the repository so Pylint can inspect tracked Python files
      - uses: actions/checkout@v7

      # Use the same Python version supported by pyproject.toml.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Install the project and all development dependencies, including Pylint.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run Pylint only when the repository contains Python files
      - name: Analyze code with Pylint
        run: |
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then
            pylint --verbose $files
          else
            echo "No Python files found."
          fi
